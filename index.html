<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我鼓勵系統 - 舒心雙件套</title>
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --card-bg: rgba(255, 255, 255, 0.85);
      --wood-brown: #8D6E63;
      --wood-dark: #5D4037;
      --matcha-green: #7A9A7E;
      --matcha-dark: #4F6D53;
      --warm-orange: #E09F67;
      --text-main: #3E3B38;
      --text-muted: #8C8782;
      --shadow-soft: 0 10px 28px rgba(93, 64, 55, 0.08);
      --border-soft: 1px solid rgba(141, 110, 99, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(145deg, #FAF7F2 0%, #F1EBE3 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: var(--shadow-soft);
      border: var(--border-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      min-height: 580px;
    }

    .header-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--wood-dark);
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--wood-dark);
      letter-spacing: 1px;
    }

    .view-panel {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.35s ease-out;
    }

    .view-panel.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Screen 1: 主選單 */
    .menu-greeting {
      font-size: 1.45rem;
      color: var(--wood-dark);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .menu-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 38px;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 18px;
    }

    .menu-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 22px 20px;
      border: var(--border-soft);
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      text-align: left;
      gap: 18px;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(141, 110, 99, 0.12);
      border-color: var(--warm-orange);
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-icon {
      font-size: 2.3rem;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F5F0;
    }

    .menu-info h3 {
      font-size: 1.15rem;
      color: var(--wood-dark);
      margin-bottom: 4px;
    }

    .menu-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Screen 2 & 3: 互動按鈕與回饋區 */
    .interactive-display {
      margin: 20px 0 28px;
      position: relative;
    }

    .interactive-circle-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFFFFF 0%, #F5EFEB 100%);
      border: 2px solid rgba(141, 110, 99, 0.2);
      box-shadow: 0 8px 24px rgba(141, 110, 99, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      outline: none;
    }

    .interactive-circle-btn:active {
      transform: scale(0.94);
      box-shadow: 0 4px 12px rgba(141, 110, 99, 0.2);
    }

    .interactive-emoji {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .tap-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .counter-badge {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(122, 154, 126, 0.15);
      color: var(--matcha-dark);
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .encouragement-quote {
      min-height: 52px;
      font-size: 1rem;
      color: var(--wood-dark);
      padding: 0 16px;
      line-height: 1.5;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 倍率選擇按鈕 (Screen 2: x3, x5, x10) */
    .multiplier-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      width: 100%;
      justify-content: center;
    }

    .mult-btn {
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(141, 110, 99, 0.25);
      background: #FFFFFF;
      color: var(--wood-dark);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mult-btn.active {
      background: var(--warm-orange);
      color: #FFFFFF;
      border-color: var(--warm-orange);
    }

    /* 浮動文字動畫 (+功德, +鼓掌) */
    .floating-text {
      position: absolute;
      font-weight: 600;
      color: var(--warm-orange);
      font-size: 1.15rem;
      pointer-events: none;
      animation: floatUp 0.85s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-55px) scale(1.15);
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 頂部導航 -->
    <header class="header-nav">
      <button class="back-btn" id="backBtn" style="visibility: hidden;" onclick="switchScreen('screen1')">
        ← 返回
      </button>
      <div class="app-title" id="pageTitle">自我鼓勵系統</div>
      <div style="width: 50px;"></div>
    </header>

    <!-- Screen 1: 主選單 -->
    <div id="screen1" class="view-panel active">
      <h1 class="menu-greeting">今日也要溫柔以待</h1>
      <p class="menu-subtitle">給予自己一些肯定與平靜</p>

      <div class="menu-grid">
        <div class="menu-card" onclick="switchScreen('screen2')">
          <div class="menu-icon">👏</div>
          <div class="menu-info">
            <h3>鼓掌鼓勵</h3>
            <p>累積能量、激勵信心</p>
          </div>
        </div>

        <div class="menu-card" onclick="switchScreen('screen3')">
          <div class="menu-icon">🪷</div>
          <div class="menu-info">
            <h3>敲木魚・積功德</h3>
            <p>靜心沉澱、善念安詳</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Screen 2: 拍手鼓掌 -->
    <div id="screen2" class="view-panel">
      <div class="counter-badge" id="clapCountText">累積鼓勵：0 次</div>

      <div class="interactive-display">
        <div id="clapArea"></div>
        <button class="interactive-circle-btn" onclick="handleClap(event)">
          <span class="interactive-emoji">👏</span>
          <span class="tap-hint">點擊鼓掌</span>
        </button>
      </div>

      <div class="encouragement-quote" id="clapQuote">
        每一步都在向前，你已經做得很棒了。
      </div>

      <!-- 倍率切換 (x1, x3, x5, x10) -->
      <div class="multiplier-group">
        <button class="mult-btn active" onclick="setMultiplier(1, this)">x1</button>
        <button class="mult-btn" onclick="setMultiplier(3, this)">x3</button>
        <button class="mult-btn" onclick="setMultiplier(5, this)">x5</button>
        <button class="mult-btn" onclick="setMultiplier(10, this)">x10</button>
      </div>
    </div>

    <!-- Screen 3: 積功德 (電子木魚) -->
    <div id="screen3" class="view-panel">
      <div class="counter-badge" id="meritCountText">累計功德：0 次</div>

      <div class="interactive-display">
        <div id="meritArea"></div>
        <button class="interactive-circle-btn" onclick="handleMerit(event)">
          <span class="interactive-emoji">🪵</span>
          <span class="tap-hint">敲擊木魚</span>
        </button>
      </div>

      <div class="encouragement-quote">
        萬物自有其時，心若安泰，歲月清幽。
      </div>
    </div>
  </div>

  <script>
    // 狀態管理
    let currentMultiplier = 1;
    let clapTotal = 0;
    let meritTotal = 0;

    const quotes = [
      "每一步都在向前，你已經做得很棒了。",
      "給自己一點時間，慢慢來最快。",
      "今天也辛苦了，謝謝你堅持到底。",
      "所有的付出，都會在悄然間開花結果。",
      "深呼吸一口氣，放鬆一下肩膀吧。",
      "無論今天如何，你始終值得被溫柔肯定。"
    ];

    // Web Audio API 柔和音效生成
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    // 播放鼓掌柔和脆音
    function playClapSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = "sine";
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // 播放木魚低沉空靈音
    function playMeritSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // 畫面切換
    function switchScreen(screenId) {
      document.querySelectorAll('.view-panel').forEach(panel => {
        panel.classList.remove('active');
      });

      const target = document.getElementById(screenId);
      if (target) target.classList.add('active');

      const backBtn = document.getElementById('backBtn');
      const pageTitle = document.getElementById('pageTitle');

      if (screenId === 'screen1') {
        backBtn.style.visibility = 'hidden';
        pageTitle.innerText = '自我鼓勵系統';
      } else if (screenId === 'screen2') {
        backBtn.style.visibility = 'visible';
        pageTitle.innerText = '鼓掌喝采';
      } else if (screenId === 'screen3') {
        backBtn.style.visibility = 'visible';
        pageTitle.innerText = '敲木魚積功德';
      }
    }

    // 設定倍率
    function setMultiplier(val, btn) {
      currentMultiplier = val;
      document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // 點擊鼓掌事件
    function handleClap(event) {
      playClapSound();
      clapTotal += currentMultiplier;
      document.getElementById('clapCountText').innerText = `累積鼓勵：${clapTotal} 次`;

      // 隨機更換一句鼓勵語
      const randQuote = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('clapQuote').innerText = randQuote;

      spawnFloatText(event, `+${currentMultiplier} 鼓勵`, '#E09F67');
    }

    // 點擊功德木魚事件
    function handleMerit(event) {
      playMeritSound();
      meritTotal += 1;
      document.getElementById('meritCountText').innerText = `累計功德：${meritTotal} 次`;

      spawnFloatText(event, '功德 +1', '#7A9A7E');
    }

    // 建立浮動飄升文字
    function spawnFloatText(event, text, color) {
      const container = event.currentTarget.parentElement;
      const floatEl = document.createElement('div');
      floatEl.className = 'floating-text';
      floatEl.innerText = text;
      floatEl.style.color = color;

      // 隨機微小左右偏移，營造自然感
      const randomOffset = (Math.random() - 0.5) * 36;
      floatEl.style.left = `calc(50% + ${randomOffset}px - 30px)`;
      floatEl.style.top = '15px';

      container.appendChild(floatEl);

      setTimeout(() => {
        floatEl.remove();
      }, 850);
    }
  </script>
</body>
</html>
