<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>自我鼓勵雙件套 👏 鼓掌積功德</title>
  <style>
    :root {
      --bg-color: #FFF9ED;
      --card-bg: #FFFFFF;
      --primary: #FF8A5B;
      --primary-hover: #FA7945;
      --secondary: #FFD166;
      --accent: #FF5A5F;
      --text-main: #332722;
      --text-sub: #7A6F68;
      --hand-stroke: #3E322D;
      --hand-fill: #FFE3D1;
      --shadow: 0 10px 25px rgba(255, 138, 91, 0.15);
      --crit-color: #FF4757;
      --gold-color: #FFA502;
    }

    [data-theme="cyber"] {
      --bg-color: #16181D;
      --card-bg: #22262E;
      --primary: #00F5D4;
      --primary-hover: #00DBBE;
      --secondary: #FFE600;
      --accent: #FF007F;
      --text-main: #F1F5F9;
      --text-sub: #94A3B8;
      --hand-stroke: #E2E8F0;
      --hand-fill: #2D3748;
      --shadow: 0 10px 30px rgba(0, 245, 212, 0.2);
      --crit-color: #FF007F;
      --gold-color: #FFE600;
    }

    [data-theme="candy"] {
      --bg-color: #F0F4FF;
      --card-bg: #FFFFFF;
      --primary: #7B2CBF;
      --primary-hover: #6822A3;
      --secondary: #FF9EAA;
      --accent: #FF4D6D;
      --text-main: #240046;
      --text-sub: #6C757D;
      --hand-stroke: #240046;
      --hand-fill: #FFCCD5;
      --shadow: 0 10px 25px rgba(123, 44, 191, 0.15);
      --crit-color: #FF4D6D;
      --gold-color: #FFB703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 頂部狀態列 */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    .title-group h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .control-buttons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid rgba(120, 120, 120, 0.15);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 99px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: transform 0.15s, background-color 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* 功德與計數面板 */
    .score-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 18px 24px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 2px solid rgba(255, 138, 91, 0.12);
      position: relative;
      overflow: hidden;
    }

    .stat-box {
      text-align: center;
      flex: 1;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .stat-num {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--primary);
      margin-top: 2px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .stat-divider {
      width: 1px;
      height: 38px;
      background: rgba(120, 120, 120, 0.15);
    }

    /* 鼓掌互動主區域 */
    .stage {
      position: relative;
      width: 100%;
      height: 340px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px dashed var(--primary);
      transition: transform 0.08s ease, border-color 0.2s ease;
      touch-action: manipulation;
    }

    .stage:active {
      transform: scale(0.965);
    }

    .clapper-visual {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hand-svg {
      width: 170px;
      height: 170px;
      transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.08));
    }

    .stage.clapping .hand-left {
      transform: rotate(-16deg) translate(14px, -6px) scale(0.95);
    }
    .stage.clapping .hand-right {
      transform: rotate(16deg) translate(-14px, -6px) scale(0.95);
    }

    .hand-pair {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hand-left {
      position: absolute;
      transform: rotate(-28deg) translate(-12px, 0);
      transform-origin: 30% 80%;
    }

    .hand-right {
      position: absolute;
      transform: rotate(28deg) scaleX(-1) translate(-12px, 0);
      transform-origin: 30% 80%;
    }

    /* 拍手火花 */
    .sparks {
      position: absolute;
      top: 15px;
      width: 100%;
      height: 60px;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .spark-line {
      position: absolute;
      width: 4px;
      height: 18px;
      background: var(--gold-color);
      border-radius: 99px;
      opacity: 0;
      transform-origin: center bottom;
      transition: opacity 0.15s, transform 0.15s;
    }

    .stage.clapping .spark-line {
      opacity: 1;
    }
    .stage.clapping .s1 { transform: rotate(-35deg) translateY(-14px); }
    .stage.clapping .s2 { transform: rotate(-10deg) translateY(-20px); }
    .stage.clapping .s3 { transform: rotate(10deg) translateY(-20px); }
    .stage.clapping .s4 { transform: rotate(35deg) translateY(-14px); }

    .stage-hint {
      position: absolute;
      bottom: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: rgba(255, 138, 91, 0.12);
      padding: 6px 18px;
      border-radius: 99px;
      letter-spacing: 1px;
    }

    /* 倍率標籤列 */
    .multiplier-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .mult-tag {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--card-bg);
      border: 1.5px solid rgba(120, 120, 120, 0.15);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mult-tag.active {
      background: var(--secondary);
      color: #332722;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 209, 102, 0.4);
      transform: scale(1.06);
    }

    /* 浮動誇獎與功德動畫 */
    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .praise-toast {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 900;
      white-space: nowrap;
      padding: 8px 18px;
      border-radius: 99px;
      animation: floatUp 1.25s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      box-shadow: 0 8px 20px rgba(0,0,0,0.14);
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .praise-toast.normal {
      background: #FFFFFF;
      color: #FF8A5B;
      border: 2px solid #FF8A5B;
    }

    .praise-toast.crit {
      background: linear-gradient(135deg, #FF5A5F, #FF8A5B);
      color: #FFFFFF;
      font-size: 1.25rem;
      border: 2px solid #FFFFFF;
      box-shadow: 0 10px 30px rgba(255, 90, 95, 0.4);
      animation: critExplosion 1.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .merit-popup {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary);
      animation: meritFly 0.9s ease-out forwards;
      text-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 15px) scale(0.7);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -20px) scale(1.08);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -65px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -105px) scale(0.9);
      }
    }

    @keyframes critExplosion {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) scale(0.5) rotate(-6deg);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -25px) scale(1.22) rotate(4deg);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, -75px) scale(1.05) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -125px) scale(0.95);
      }
    }

    @keyframes meritFly {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.6);
      }
      30% {
        opacity: 1;
        transform: translate(-50%, -30px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -85px) scale(0.85);
      }
    }

    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: particlePop 0.75s ease-out forwards;
    }

    @keyframes particlePop {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    /* 即時鼓勵長條 */
    .praise-banner {
      width: 100%;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 14px 20px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    /* 風格切換按鈕 */
    .theme-switch-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .theme-pill {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 99px;
      cursor: pointer;
      border: 1px solid rgba(120, 120, 120, 0.2);
      background: var(--card-bg);
      color: var(--text-sub);
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-pill.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }
  </style>
</head>
<body data-theme="warm">

  <div class="floating-container" id="floatingContainer"></div>

  <div class="app-container">

      <div class="control-buttons">

        <button class="icon-btn" id="resetBtn" title="重新計數">↺ 重置</button>
      </div>
    </div>

    <div class="score-card">
      <div class="stat-box">
        <div class="stat-label">累積功德</div>
        <div class="stat-num" id="meritCount">0</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-box">
        <div class="stat-label">鼓掌次數</div>
        <div class="stat-num" id="clapCount">0</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-box">
        <div class="stat-label">最高連擊</div>
        <div class="stat-num" id="streakCount">0</div>
      </div>
    </div>

    <div class="stage" id="clapStage">
      <div class="sparks">
        <div class="spark-line s1"></div>
        <div class="spark-line s2"></div>
        <div class="spark-line s3"></div>
        <div class="spark-line s4"></div>
      </div>

      <div class="clapper-visual">
        <div class="hand-pair">
          <svg class="hand-svg hand-left" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M45 125 C30 110 32 85 45 70 C52 62 60 52 70 38 C75 30 84 30 88 38 C90 44 85 58 80 68 L105 50 C112 45 119 49 119 56 C119 62 108 76 96 86 L118 78 C126 75 131 82 128 89 C124 96 112 108 100 116 L112 112 C118 110 122 116 119 122 C114 130 95 142 75 142 C58 142 50 134 45 125 Z" 
                  fill="var(--hand-fill)" stroke="var(--hand-stroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M68 85 L88 74" stroke="var(--hand-stroke)" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M72 105 L96 95" stroke="var(--hand-stroke)" stroke-width="3.5" stroke-linecap="round"/>
          </svg>

          <svg class="hand-svg hand-right" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M45 125 C30 110 32 85 45 70 C52 62 60 52 70 38 C75 30 84 30 88 38 C90 44 85 58 80 68 L105 50 C112 45 119 49 119 56 C119 62 108 76 96 86 L118 78 C126 75 131 82 128 89 C124 96 112 108 100 116 L112 112 C118 110 122 116 119 122 C114 130 95 142 75 142 C58 142 50 134 45 125 Z" 
                  fill="var(--hand-fill)" stroke="var(--hand-stroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M68 85 L88 74" stroke="var(--hand-stroke)" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M72 105 L96 95" stroke="var(--hand-stroke)" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="stage-hint">點擊鼓掌 👏 激發好運</div>
    </div>

    <div class="multiplier-bar">
      <div class="mult-tag active" id="tag1">x1 普攻</div>
      <div class="mult-tag" id="tag3">x3 爆擊</div>
      <div class="mult-tag" id="tag5">x5 大神</div>
      <div class="mult-tag" id="tag10">x10 宇宙無敵</div>
    </div>

    <div class="praise-banner" id="praiseBanner">
      ✨ 點一下鼓掌，給最棒的自己加油！
    </div>

    <div class="theme-switch-bar">
      <span style="font-size: 0.8rem; color: var(--text-sub);">風格配色：</span>
      <button class="theme-pill active" onclick="setTheme('warm')">元氣暖橘</button>
      <button class="theme-pill" onclick="setTheme('cyber')">賽博功德</button>
      <button class="theme-pill" onclick="setTheme('candy')">糖果多巴胺</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClapSound(isCrit) {
      if (!audioEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // 擬真拍手白噪音爆破音
      const bufferSize = audioCtx.sampleRate * 0.08;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(isCrit ? 1400 : 1000, now);
      filter.Q.setValueAtTime(1.5, now);

      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.7, now);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + (isCrit ? 0.18 : 0.09));

      whiteNoise.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      whiteNoise.start(now);
      whiteNoise.stop(now + 0.2);

      // 暴擊獎勵音效（和弦）
      if (isCrit) {
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        oscGain.gain.setValueAtTime(0.25, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    const normalQuotes = [
      "天啊！你也太棒了吧！",
      "怎麼會有人這麼厲害～",
      "哇！這個效率簡直神了！",
      "今天也是閃閃發光的小天才！",
      "功德圓滿，好運排隊找你！",
      "給超努力的自己拍拍手！",
      "簡直太優秀了，無可挑剔！",
      "做得好！今天也是滿分的一天！",
      "怎麼那麼聰明！無敵了吧！",
      "太強了！完全被你折服！",
      "狀態滿分！繼續衝呀！"
    ];

    const critQuotes = {
      3: [
        "⚡ 實力大爆發！直接起飛！",
        "⚡ 哇塞！這到底是什麼神仙操作！",
        "⚡ 功德 x3！好運擋都擋不住！"
      ],
      5: [
        "🔥 怎麼那麼厲害！根本是超神表現！",
        "🔥 宇宙級優秀！所有人都在為你鼓掌！",
        "🔥 功德 x5 暴擊！福氣直接灌頂！"
      ],
      10: [
        "👑 救命！天才降臨！你的能量已經突破天際了！",
        "👑 歐皇大暴擊！全世界都要向你致敬！",
        "👑 功德 x10 圓滿！人生大贏家非你莫屬！"
      ]
    };

    let merits = 0;
    let claps = 0;
    let streak = 0;
    let streakTimer = null;

    try {
      merits = parseInt(localStorage.getItem('merit_val') || '0', 10);
      claps = parseInt(localStorage.getItem('clap_val') || '0', 10);
    } catch(e) {}

    const meritEl = document.getElementById('meritCount');
    const clapEl = document.getElementById('clapCount');
    const streakEl = document.getElementById('streakCount');
    const stage = document.getElementById('clapStage');
    const floatingContainer = document.getElementById('floatingContainer');
    const praiseBanner = document.getElementById('praiseBanner');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const resetBtn = document.getElementById('resetBtn');

    const tags = {
      1: document.getElementById('tag1'),
      3: document.getElementById('tag3'),
      5: document.getElementById('tag5'),
      10: document.getElementById('tag10')
    };

    function updateStats() {
      meritEl.textContent = merits.toLocaleString();
      clapEl.textContent = claps.toLocaleString();
      streakEl.textContent = streak;
      try {
        localStorage.setItem('merit_val', merits);
        localStorage.setItem('clap_val', claps);
      } catch(e) {}
    }
    updateStats();

    function setActiveTag(multiplier) {
      Object.values(tags).forEach(t => t.classList.remove('active'));
      if (tags[multiplier]) {
        tags[multiplier].classList.add('active');
      }
    }

    function spawnParticles(x, y, color) {
      const count = 12;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 6;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color || 'var(--secondary)';
        p.style.left = x + 'px';
        p.style.top = y + 'px';

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const dist = Math.random() * 70 + 40;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

        floatingContainer.appendChild(p);
        setTimeout(() => p.remove(), 750);
      }
    }

    function doClap(e) {
      initAudio();

      stage.classList.remove('clapping');
      void stage.offsetWidth;
      stage.classList.add('clapping');
      setTimeou
